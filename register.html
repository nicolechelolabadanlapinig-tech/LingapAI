<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - LingapAI</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- NAVIGATION -->

    <header class="navbar">

        <div class="logo">
            <span>Lingap</span><strong>AI</strong>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- REGISTRATION -->

    <main class="form-page">

        <div class="form-container">

            <div class="form-header">

                <span class="badge">
                    SOLO PARENT REGISTRATION
                </span>

                <h1>Create Your Account</h1>

                <p>
                    Register to apply for assistance and manage
                    your Solo Parent applications through LingapAI.
                </p>

            </div>


            <form id="registerForm">

                <!-- PERSONAL INFORMATION -->

                <h2>Personal Information</h2>

                <div class="form-row">

                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="Enter your first name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Enter your last name"
                            required
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="birthDate">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            id="birthDate"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="contact">
                            Contact Number
                        </label>

                        <input
                            type="tel"
                            id="contact"
                            placeholder="09XXXXXXXXX"
                            required
                        >

                    </div>

                </div>


                <!-- ADDRESS -->

                <h2>Address Information</h2>

                <div class="form-group">

                    <label for="address">
                        Complete Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter your complete address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="barangay">
                        Barangay
                    </label>

                    <input
                        type="text"
                        id="barangay"
                        placeholder="Enter your barangay"
                        required
                    >

                </div>


                <!-- SOLO PARENT INFORMATION -->

                <h2>Solo Parent Information</h2>

                <div class="form-group">

                    <label for="category">
                        Solo Parent Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select your category
                        </option>

                        <option value="category1">
                            Category 1
                        </option>

                        <option value="category2">
                            Category 2
                        </option>

                        <option value="category3">
                            Category 3
                        </option>

                        <option value="category4">
                            Category 4
                        </option>

                        <option value="category5">
                            Category 5
                        </option>

                        <option value="category6">
                            Category 6
                        </option>

                        <option value="category7">
                            Category 7
                        </option>

                    </select>

                </div>


                <!-- ACCOUNT -->

                <h2>Account Information</h2>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>

                </div>


                <!-- TERMS -->

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I confirm that the information I provided
                        is accurate.
                    </label>

                </div>


                <button
                    type="submit"
                    class="form-button"
                >
                    Create Account
                </button>


                <p class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </form>

        </div>

    </main>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                if (password !== confirmPassword) {

                    alert("Passwords do not match.");

                    return;
                }


                alert(
                    "Registration successful! You can now log in."
                );


                window.location.href = "login.html";

            });

    </script>

</body>

</html>
