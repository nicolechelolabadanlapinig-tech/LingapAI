<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - LingapAI</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            <span>Lingap</span><strong>AI</strong>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- LOGIN PAGE -->

    <main class="login-page">

        <div class="login-container">

            <div class="login-icon">
                AI
            </div>

            <span class="badge">
                SOLO PARENT PORTAL
            </span>

            <h1>Welcome Back</h1>

            <p class="login-description">
                Log in to manage your Solo Parent
                assistance applications.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="form-button"
                >
                    Login
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;


                if (email && password) {

                    window.location.href =
                        "dashboard.html";

                }

            });

    </script>

</body>

</html>
